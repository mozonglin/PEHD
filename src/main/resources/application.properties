server.port=9999

# 数据库配置（生产：pexitong4，结构对标 pexitongtest）
spring.datasource.url=jdbc:mysql://38.207.179.218:3306/pexitong4?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=pexitong3
spring.datasource.password=790128mmmm
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池配置
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# JWT配置
jwt.secret=mySecretKeyForPECampusApplicationThatShouldBeLongEnough
jwt.expiration=3600
jwt.refresh-token.expiration=604800

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON配置
spring.jackson.time-zone=Asia/Shanghai
# 注意：LocalDateTime格式化由JacksonConfig类处理，支持多种格式

# 日志配置
logging.level.com.example.pehd=DEBUG
logging.level.org.springframework.security=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# WebSocket配置
websocket.heartbeat-interval=30000
websocket.connection-timeout=300000
websocket.max-connections=1000

# 积分计算配置
points.activity-base-points=1
points.morning-exercise-points=1
points.calculation-rule=duration

# 二维码配置
qr-code.expiry-seconds=40
qr-code.cleanup-interval=300000

# 器材管理配置
equipment.low-stock-threshold=5
equipment.max-borrow-quantity=10
equipment.max-borrow-days=30

